name: React CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: employeehub-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: employeehub-ui/package-lock.json

      - name: Verify Node Installation
        run: node -v

      - name: Verify npm Installation
        run: npm -v

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build